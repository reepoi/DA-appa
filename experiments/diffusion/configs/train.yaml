defaults:
  - backbone: vit_large
  - optim: adamw

data:
  # Time in hours between consecutive rows in the latent H5 file.
  time_interval: 6

train:
  update_steps: 500_000
  # Number of elements that can fit at once on a gpu
  batch_element_per_gpu: 128
  # Effective batch size for one optimizer step
  batch_size_per_step: 2048
  precision: float16
  # Minimal number of samples seen to log statistics
  log_interval: 1024
  # Minimal number of samples seen to save checkpoints
  save_interval: 8192
  shuffle_training: true
  standardize: true
  # Row stride between two adjacent samples of a blanket in the latent H5 file.
  # With data.time_interval=6, blanket_dt=1 means adjacent samples are 6h apart.
  blanket_dt: 1
  # Number of latent samples per blanket. With 6h data, 24 samples = 144h.
  blanket_size: 4
  noise_schedule: rectified
  sigma_min: 1e-3
  sigma_max: 1e3
  inject_ae_noise: true

loss:
  sigma_min_penalty: 0

valid:
  log_interval: 16384
  # Quantitative
  n_valid_samples: 32
  # Qualitative
  n_valid_dates: 2
  n_valid_samples_per_date: 1
  n_valid_channels: 3
  denoising_steps: 64

# AE run that generated the latents (e.g., cg33oqw8/0)
ae_run: 45nj4wnq/0
# ID of the latent data dump (e.g., k3j4l2fz)
latent_dump: i5a4l2d7
latent_data: "latent_dump_era5.h5"

slurm_account: taost
wandb_entity: utah-math-data-science
